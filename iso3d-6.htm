<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIM Expert 1:1 (+GF+ Fittings)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; touch-action: none; }
        .dn-container { position: fixed; top: 15px; left: 15px; z-index: 100; display: none; flex-direction: column; gap: 6px; max-height: 80vh; overflow-y: auto; }
        .dn-btn { width: 55px; height: 42px; border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 13px; }
        .controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; background: rgba(0,0,0,0.9); padding: 12px 20px; border-radius: 40px; z-index: 100; border: 1px solid rgba(255,255,255,0.1); }
        button.tool { width: 52px; height: 52px; border-radius: 50%; border: none; background: #333; color: white; font-weight: bold; cursor: pointer; font-size: 18px; }
        button.active { background: #2196F3; box-shadow: 0 0 15px #2196F3; }
        #lengthModal { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 20px; display: none; text-align: center; z-index: 1000; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        input { width: 120px; font-size: 32px; padding: 10px; text-align: center; border: 2px solid #2196F3; border-radius: 12px; margin-bottom: 15px; outline: none; }
    </style>
</head>
<body>

<div class="dn-container" id="dnPanel">
    <button class="dn-btn" onclick="setDN('DN15', 21.3, '#00BFFF')" style="background:#00BFFF">15</button>
    <button class="dn-btn" onclick="setDN('DN20', 26.9, '#FFEB3B')" style="background:#FFEB3B; color:black">20</button>
    <button class="dn-btn" onclick="setDN('DN25', 33.7, '#F44336')" style="background:#F44336">25</button>
    <button class="dn-btn" onclick="setDN('DN32', 42.4, '#4CAF50')" style="background:#4CAF50">32</button>
    <button class="dn-btn" onclick="setDN('DN40', 48.3, '#FF9800')" style="background:#FF9800">40</button>
    <button class="dn-btn" onclick="setDN('DN50', 60.3, '#9C27B0')" style="background:#9C27B0">50</button>
    <button class="dn-btn" onclick="setDN('DN65', 76.1, '#0D47A1')" style="background:#0D47A1">65</button>
</div>

<div id="lengthModal">
    <div style="margin-bottom:10px; color:#666; font-weight:bold;">ДЛИНА (МЕТРЫ) 1:1</div>
    <input type="number" id="lenVal" value="1.0" step="0.1" inputmode="decimal">
    <br>
    <button onclick="confirmPipe()" style="width:100%; padding:15px; background:#4CAF50; color:white; border:none; border-radius:12px; font-weight:bold;">OK</button>
</div>

<div class="controls">
    <button id="btnZ" class="tool" onclick="toggleZ()">Z</button>
    <button id="btnR" class="tool" onclick="toggleR()">R</button>
    <button id="btnD" class="tool" onclick="toggleD()">Ø</button>
    <button id="btnF" class="tool" onclick="generateFittings()">F</button>
    <button class="tool" onclick="undo()" style="background:#444">↩</button>
    <button class="tool" onclick="location.reload()" style="background:#b71c1c">✖</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls, raycaster;
    let isDrawing = false, startPoint = null, currentDir = new THREE.Vector3();
    let previewPipe, pipes = [], nodes = [], fittings = [];
    
    // Масштаб 1 к 1. Размеры труб (наружные) в метрах
    let currentDN = { label: 'DN25', r: 33.7 / 2000, color: '#F44336' };
    let mode = 'draw'; 

    // --- БАЗА ДАННЫХ РАЗМЕРОВ +GF+ (из ваших картинок, переведено в метры) ---
    const GF_CATALOG = {
        'DN15': { a: 0.028, z: 0.015, nipple_a: 0.044 }, // 1/2"
        'DN20': { a: 0.033, z: 0.018, nipple_a: 0.047 }, // 3/4"
        'DN25': { a: 0.038, z: 0.021, nipple_a: 0.053 }, // 1"
        'DN32': { a: 0.045, z: 0.026, nipple_a: 0.057 }, // 1 1/4"
        'DN40': { a: 0.050, z: 0.031, nipple_a: 0.059 }, // 1 1/2"
        'DN50': { a: 0.058, z: 0.034, nipple_a: 0.068 }, // 2"
        'DN65': { a: 0.069, z: 0.042, nipple_a: 0.075 }  // 2 1/2"
    };

    const fitMat = new THREE.MeshPhongMaterial({ color: 0x888888, shininess: 100 }); // Серый чугун

    init();
    animate();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 100);
        camera.position.set(2, 2, 2);
        camera.up.set(0, 0, 1);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const sun = new THREE.DirectionalLight(0xffffff, 1); sun.position.set(5, 5, 10); scene.add(sun);
        
        const grid = new THREE.GridHelper(10, 100, 0x333333, 0x222222); grid.rotation.x = Math.PI / 2; scene.add(grid);

        controls = new OrbitControls(camera, renderer.domElement); controls.enabled = false;
        raycaster = new THREE.Raycaster();

        previewPipe = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 16), new THREE.MeshBasicMaterial({ color: 0x2196F3, transparent: true, opacity: 0.5 })); previewPipe.visible = false; scene.add(previewPipe);

        renderer.domElement.addEventListener('pointerdown', onDown);
        renderer.domElement.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
    }

    // --- UI LOGIC ---
    window.toggleR = () => { mode = (mode === 'view') ? 'draw' : 'view'; updateUI(); };
    window.toggleD = () => { mode = (mode === 'diameter') ? 'draw' : 'diameter'; updateUI(); };
    window.toggleZ = () => { camera.position.set(camera.position.x, camera.position.y, 3); camera.lookAt(camera.position.x, camera.position.y, 0); mode = 'draw'; updateUI(); };
    function updateUI() {
        document.getElementById('btnR').className = (mode === 'view') ? 'tool active' : 'tool';
        document.getElementById('btnD').className = (mode === 'diameter') ? 'tool active' : 'tool';
        document.getElementById('dnPanel').style.display = (mode === 'diameter') ? 'flex' : 'none';
        controls.enabled = (mode === 'view');
    }
    window.setDN = (label, outerDiam, col) => { currentDN = { label, r: outerDiam / 2000, color: col }; };

    // =========================================================================
    // --- АЛГОРИТМ ГЕНЕРАЦИИ ТОЧНЫХ ФИТИНГОВ +GF+ ---
    // =========================================================================
    window.generateFittings = () => {
        fittings.forEach(f => scene.remove(f)); fittings = [];
        const nodeMap = new Map();

        pipes.forEach(pipe => {
            const dir = new THREE.Vector3(0, 1, 0).applyQuaternion(pipe.quaternion);
            const halfL = pipe.userData.L / 2;
            const p1 = pipe.position.clone().add(dir.clone().multiplyScalar(halfL));
            const p2 = pipe.position.clone().add(dir.clone().multiplyScalar(-halfL));
            [p1, p2].forEach(p => {
                const key = `${p.x.toFixed(3)},${p.y.toFixed(3)},${p.z.toFixed(3)}`;
                if (!nodeMap.has(key)) nodeMap.set(key, []); nodeMap.get(key).push(pipe);
            });
        });

        nodeMap.forEach((connected, key) => {
            if (connected.length < 2) return;
            const pos = new THREE.Vector3(...key.split(',').map(Number));
            
            // Находим максимальный диаметр в узле (напр. DN50 для тройника 50-25-50)
            let maxPipe = connected[0];
            connected.forEach(p => { if (p.userData.r > maxPipe.userData.r) maxPipe = p; });
            const maxDN = maxPipe.userData.dn;
            const dims = GF_CATALOG[maxDN]; // Берём размеры +GF+ для этого DN

            let mainFitting;

            // --- КЛАССИФИКАЦИЯ И СОЗДАНИЕ ГЕОМЕТРИИ ---
            if (connected.length === 2) {
                const dir1 = new THREE.Vector3(0,1,0).applyQuaternion(connected[0].quaternion);
                const dir2 = new THREE.Vector3(0,1,0).applyQuaternion(connected[1].quaternion);
                const angle = dir1.angleTo(dir2);

                if (angle > 0.1 && angle < Math.PI - 0.1) {
                    // --- ELBOW 90° (+GF+ 90) ---
                    mainFitting = createElbowGF(dims, dir1, dir2);
                }
            } else if (connected.length >= 3) {
                // --- TEE EQUAL (+GF+ 130) ---
                mainFitting = createTeeGF(dims, connected, pos);
            }

            if (mainFitting) {
                mainFitting.position.copy(pos);
                scene.add(mainFitting);
                fittings.push(mainFitting);

                // --- ЛОГИКА АВТО-ПЕРЕХОДОВ (REDUCERS) С НИППЕЛЯМИ ---
                connected.forEach(p => {
                    // Если труба тоньше, чем корпус фитинга
                    if (p.userData.r < maxPipe.userData.r - 0.0001) {
                        const pipeDN = p.userData.dn;
                        const pipeDims = GF_CATALOG[pipeDN];
                        const dirToPipe = p.position.clone().sub(pos).normalize();

                        // 1. Ставим шестигранный НИППЕЛЬ (+GF+ 280) серого цвета
                        const nipple = createHexNippleGF(pipeDims);
                        // Смещаем его за пределы корпуса фитинга (размер 'a' фитинга)
                        const nipplePos = pos.clone().add(dirToPipe.clone().multiplyScalar(dims.a));
                        nipple.position.copy(nipplePos);
                        nipple.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirToPipe);
                        scene.add(nipple);
                        fittings.push(nipple);

                        // 2. Ставим КОНУС-ПЕРЕХОД (+GF+ 240) серого цвета
                        // Размеры перехода берем: торец 1 = DN трубы, торец 2 = DN фитинга
                        const reducerLen = dims.a; // Длина конуса примерно равна размеру фитинга
                        const reducer = new THREE.Mesh(
                            new THREE.CylinderGeometry(p.userData.r * 1.1, maxPipe.userData.r * 1.1, reducerLen, 16),
                            fitMat
                        );
                        // Смещаем за ниппель
                        reducer.position.copy(nipplePos.clone().add(dirToPipe.clone().multiplyScalar(reducerLen / 2 + pipeDims.nipple_a/2)));
                        reducer.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirToPipe);
                        scene.add(reducer);
                        fittings.push(reducer);
                    }
                });
            }
        });
    };

    // --- ФУНКЦИИ ГЕНЕРАЦИИ ГЕОМЕТРИИ ФИТИНГОВ +GF+ ---

    // 1. Точный Тройник (Equal Tee, +GF+ 130)
    function createTeeGF(dims, connected, pos) {
        const teeGroup = new THREE.Group();
        const r_fit = connected[0].userData.r * 1.2; // Корпус чуть шире трубы
        const len_main = dims.a * 2; // Полная длина магистрали
        const len_branch = dims.a; // Длина отвода

        // Магистраль (сквозная труба)
        const main = new THREE.Mesh(new THREE.CylinderGeometry(r_fit, r_fit, len_main, 16), fitMat);
        
        // Определяем направление магистрали по первым двум соосным трубам
        const dirM1 = new THREE.Vector3(0,1,0).applyQuaternion(connected[0].quaternion);
        const dirM2 = new THREE.Vector3(0,1,0).applyQuaternion(connected[1].quaternion);
        
        main.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirM1);
        teeGroup.add(main);

        // Отвод (перпендикулярная труба)
        const branch = new THREE.Mesh(new THREE.CylinderGeometry(r_fit, r_fit, len_branch, 16), fitMat);
        // Смещаем отвод от центра на половину длины
        branch.position.y = len_branch / 2;
        
        // Находим направление отвода (третья труба)
        let dirBranch;
        if (connected[2]) { dirBranch = connected[2].position.clone().sub(pos).normalize(); }
        else { dirBranch = new THREE.Vector3(0,0,1); } // Дефолт если труб мало

        branch.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirBranch);
        teeGroup.add(branch);

        return teeGroup;
    }

    // 2. Точный Отвод (Elbow 90°, +GF+ 90)
    function createElbowGF(dims, dir1, dir2) {
        // Отвод +GF+ 90° - это четверть тора (бублика)
        const arcMat = new THREE.MeshPhongMaterial({ color: 0x888888 });
        
        // Радиус изгиба рассчитывается так, чтобы центр трубы прошел через точку 'a'
        const pipeR = currentDN.r * 1.2;
        const bendR = dims.a - pipeR; // Радиус по центру трубы

        // TorusGeometry(радиус тора, радиус трубы, сегменты кольца, сегменты трубы, дуга)
        const geometry = new THREE.TorusGeometry(bendR, pipeR, 12, 16, Math.PI / 2);
        const elbow = new THREE.Mesh(geometry, fitMat);

        // Позиционируем тор так, чтобы его концы совпали с осями труб
        elbow.position.set(-bendR, 0, 0);

        const group = new THREE.Group(); group.add(elbow);
        
        // Поворачиваем группу в плоскость между двумя трубами
        const normal = new THREE.Vector3().crossVectors(dir1, dir2).normalize();
        group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
        
        return group;
    }

    // 3. Шестигранный Ниппель (Hex Nipple, +GF+ 280)
    function createHexNippleGF(pipeDims) {
        const nippleGroup = new THREE.Group();
        const r = pipeDims.nipple_r || currentDN.r; // Радиус резьбы
        
        // Две резьбовые части (цилиндры)
        const threadLen = pipeDims.nipple_a * 0.4;
        const threads1 = new THREE.Mesh(new THREE.CylinderGeometry(r, r, threadLen, 16), fitMat);
        threads1.position.y = pipeDims.nipple_a * 0.3;
        nippleGroup.add(threads1);

        const threads2 = new THREE.Mesh(new THREE.CylinderGeometry(r, r, threadLen, 16), fitMat);
        threads2.position.y = -pipeDims.nipple_a * 0.3;
        nippleGroup.add(threads2);

        // Центральный шестигранник (под ключ, +GF+ схеме)
        // BoxGeometry(r*3, r*3, r*3) - упрощенно куб, т.к. 3D-шестигранник сложнее кодить
        const hex = new THREE.Mesh(new THREE.BoxGeometry(r * 2.5, r * 2.5, r * 2.5), fitMat);
        nippleGroup.add(hex);

        return nippleGroup;
    }

    // --- ОСТАЛЬНАЯ ЛОГИКА (РИСОВАНИЕ, ZOOM) БЕЗ ИЗМЕНЕНИЙ ---
    function onDown(e) {
        if (mode === 'view') return;
        const m = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        raycaster.setFromCamera(m, camera);
        if (mode === 'diameter') {
            const hits = raycaster.intersectObjects(pipes);
            if (hits.length > 0) {
                const p = hits[0].object;
                p.geometry.dispose();
                p.geometry = new THREE.CylinderGeometry(currentDN.r, currentDN.r, p.userData.L, 16);
                p.material.color.set(currentDN.color);
                p.userData.dn = currentDN.label; p.userData.r = currentDN.r;
            }
            return;
        }
        let snap = null;
        nodes.forEach(n => {
            const proj = n.clone().project(camera);
            if (Math.hypot(m.x - proj.x, m.y - proj.y) < 0.05) snap = n.clone();
        });
        const h = snap ? snap.z : (nodes.length > 0 ? nodes[nodes.length-1].z : 0);
        startPoint = snap || new THREE.Vector3();
        if(!snap) raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,0,1), -h), startPoint);
        isDrawing = true;
    }
    function onMove(e) {
        if (!isDrawing || mode !== 'draw') return;
        const m = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        raycaster.setFromCamera(m, camera);
        const cur = new THREE.Vector3();
        raycaster.ray.intersectPlane(new THREE.Plane(camera.getWorldDirection(new THREE.Vector3()).negate(), -startPoint.dot(camera.getWorldDirection(new THREE.Vector3()).negate())), cur);
        const diff = cur.sub(startPoint);
        const ax = Math.abs(diff.x), ay = Math.abs(diff.y), az = Math.abs(diff.z);
        currentDir.set(0,0,0);
        let d = 0;
        if (ax > ay && ax > az) { currentDir.x = Math.sign(diff.x); d = ax; }
        else if (ay > ax && ay > az) { currentDir.y = Math.sign(diff.y); d = ay; }
        else { currentDir.z = Math.sign(diff.z); d = az; }
        if (d > 0.01) {
            previewPipe.visible = true;
            previewPipe.geometry.dispose();
            previewPipe.geometry = new THREE.CylinderGeometry(currentDN.r, currentDN.r, d, 16);
            previewPipe.position.copy(startPoint.clone().add(currentDir.clone().multiplyScalar(d/2)));
            previewPipe.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), currentDir);
        }
    }
    function onUp() { if (isDrawing && previewPipe.visible) { document.getElementById('lengthModal').style.display = 'block'; document.getElementById('lenVal').focus(); } isDrawing = false; }
    window.confirmPipe = () => {
        const L = parseFloat(document.getElementById('lenVal').value) || 1.0;
        const end = startPoint.clone().add(currentDir.clone().multiplyScalar(L));
        const pipe = new THREE.Mesh(new THREE.CylinderGeometry(currentDN.r, currentDN.r, L, 16), new THREE.MeshPhongMaterial({ color: currentDN.color, shininess: 80 }));
        pipe.position.copy(startPoint.clone().add(end).divideScalar(2));
        pipe.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), currentDir);
        pipe.userData = { L, dn: currentDN.label, r: currentDN.r };
        scene.add(pipe); pipes.push(pipe); nodes.push(end.clone());
        previewPipe.visible = false; document.getElementById('lengthModal').style.display = 'none';
    };
    window.undo = () => { const p = pipes.pop(); if(p) { scene.remove(p); nodes.pop(); } fittings.forEach(f => scene.remove(f)); fittings = []; };
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
</script>
</body>
</html>
